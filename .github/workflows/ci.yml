name: CI

on:
  push:
    branches: ["dev", "main"]
  pull_request:
    branches: ["dev", "main"]

jobs:
  backend:
    name: Backend in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build backend
      - run: docker compose run --rm backend python -m ruff check .
      - run: docker compose run --rm backend python manage.py makemigrations --check --dry-run
      - run: docker compose run --rm backend python manage.py check
      - run: docker compose run --rm backend python -m pytest
      - if: always()
        run: docker compose down -v

  frontend:
    name: Frontend in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build frontend
      - run: docker compose run --rm --no-deps frontend npm run lint
      - run: docker compose run --rm --no-deps frontend npm run typecheck
      - run: docker compose run --rm --no-deps frontend npm run test
      - run: docker compose run --rm --no-deps frontend npm run build
      - if: always()
        run: docker compose down -v

  e2e:
    name: Playwright in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d backend frontend
      - run: docker compose --profile test run --rm frontend_e2e
      - if: always()
        run: docker compose --profile test down -v

  compose:
    name: Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
